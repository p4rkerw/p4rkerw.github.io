# Checks the site's links on every push (after that commit's GitHub Pages deploy finishes)
# and once a week. Root-relative links (/people/, /assets/...) are checked against the live site.
name: Link check

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 12 * * 1"   # Mondays 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Wait for GitHub Pages deploy of this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            s=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}" \
                  --jq '[.workflow_runs[] | select(.name=="pages build and deployment")][0].status // "none"')
            echo "pages deploy: $s"
            [ "$s" = "completed" ] && exit 0
            sleep 20
          done
          echo "Timed out waiting for Pages deploy; checking anyway"
      - name: Check links in site sources
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          output: lychee.json
          format: json
          args: >-
            --no-progress
            --max-concurrency 4
            --base-url https://www.parkerwilsonlab.com
            --accept 200,203,206,403,429,999
            --exclude '^https?://(www\.)?linkedin\.com'
            --exclude '^https?://(x|twitter)\.com'
            --exclude '^mailto:'
            --exclude '^https?://(localhost|127\.0\.0\.1)'
            --exclude '%7B%7B|\{\{'
            './_posts/*.md' './_pages/*.md' './_pages/*.html' './_people/*.md'
            './_publications/*.md' './_software/*.md' './_data/*.yml'
            './index.md' './README.md'
          fail: false

      - name: Report broken links
        if: steps.lychee.outputs.exit_code != '0'
        run: |
          jq -r '.error_map // .fail_map // {} | to_entries[] | .key as $f | .value[] | "::error file=\($f)::\(.url) -> \(.status.text // .status | tostring)"' lychee.json || cat lychee.json
          exit 1
