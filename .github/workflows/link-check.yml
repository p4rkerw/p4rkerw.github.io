# Checks the site's links on every push and once a week; opens no PRs, just reports.
name: Link check

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 12 * * 1"   # Mondays 12:00 UTC
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check links in site sources
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          output: lychee.json
          format: json
          args: >-
            --no-progress
            --max-concurrency 4
            --accept 200,203,206,403,429,999
            --exclude '^https?://(www\.)?linkedin\.com'
            --exclude '^https?://(x|twitter)\.com'
            --exclude '^mailto:'
            --exclude '^https?://(localhost|127\.0\.0\.1)'
            --exclude '^/'
            './_posts/*.md' './_pages/*.md' './_pages/*.html' './_people/*.md'
            './_publications/*.md' './_software/*.md' './_data/*.yml'
            './index.md' './README.md'
          fail: false

      - name: Report broken links
        if: steps.lychee.outputs.exit_code != '0'
        run: |
          jq -r '.error_map // .fail_map // {} | to_entries[] | .key as $f | .value[] | "::error file=\($f)::\(.url) -> \(.status.text // .status | tostring)"' lychee.json || cat lychee.json
          exit 1
